name: Build JARVIS APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find . \
            -name settings.gradle.kts \
            -type f \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --console=plain \
            --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
